{{ form_ajax('onSignin') }}
    <div class="ui form">
        <div class="fields">
            <div class="field">
                <label for="userSigninLogin">{{ loginAttributeLabel }}</label>
                <input
                    name="login"
                    type="text"
                    id="userSigninLogin"
                    placeholder="Enter your {{ loginAttributeLabel|lower }}" />
            </div>
            <div class="field">
                <label for="userSigninPassword">Password</label>
                <input
                    name="password"
                    type="password"
                    id="userSigninPassword"
                    placeholder="Enter your password" />
            </div>
        </div>
    </div>

    <div class="mt-1 login-actions">
        <button type="submit" class="btn-primary">Sign in</button>
    </div>

    <div class="row mt-1 login-extras">
        <div class="col-xs-12 col-sm-6">
            {% if rememberLoginMode == 'ask' %}
            <div class="ui form">
                <div class="field inline align-items-baseline">
                    <input id="remember" name="remember" type="checkbox" value="1" />
                    <label for="remember">Remember me</label>
                </div>
            </div>
            {% endif %}
        </div>
        <div class="col-xs-12 col-sm-6 text-right">
            <a class="btn btn-link" href="/forgot">Forgot your password?</a>
        </div>
    </div>
{{ form_close() }}
