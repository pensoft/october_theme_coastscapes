{# Hero Section - Homepage Only #}
{% if page_id == 'home' %}
<section class="hero-section" role="banner" aria-label="COAST-SCAPES hero">
    <div class="hero-background container-dynamic">
        <img class="hero-image" src="{{ 'home-img.png' | media }}" alt="COAST-SCAPES coastal landscape">
        <div class="hero-content">
            <h1 class="hero-headline">
                <span class="hero-word text-white">Rethinking</span>
                <span class="hero-word text-gradient">COAST</span><span class="hero-word text-white">al</span>
                <br>
                <span class="hero-word text-white">Land</span><span class="hero-word text-gradient">SCAPES</span>
            </h1>
            <p class="hero-subtitle">
                With climate-resilient interventions - Systemic land-to-sea solutions
            </p>
            <a href="/about" class="btn btn-primary">
                Learn about our mission
            </a>
        </div>
    </div>
</section>
{% endif %}
